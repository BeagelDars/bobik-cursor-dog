<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bobik the Russian Cursor Dog</title>
    <script type="module" crossorigin src="/bobik-cursor-dog/assets/index-C9d8qyuw.js"></script>
    <link rel="stylesheet" crossorigin href="/bobik-cursor-dog/assets/index-DxFPah4A.css">
  </head>
  <body>
    <div id="particle-container"></div>
    
    <!-- Bobik -->
    <div id="bobik" class="idle" style="transform: translate(50vw, 50vh);">
      <!-- Tail -->
      <div class="tail"></div>
      
      <!-- Back Legs -->
      <div class="leg back-left"></div>
      <div class="leg front-left"></div>
      
      <!-- Body -->
      <div class="body">
        <div class="chest"></div>
      </div>
      
      <!-- Front Legs -->
      <div class="leg back-right"></div>
      <div class="leg front-right"></div>
      
      <!-- Head -->
      <div class="head">
        <!-- Back Ear -->
        <div class="ear left"></div>
        
        <!-- Face -->
        <div class="face">
          <div class="eye left"></div>
          <div class="eye right"></div>
          <div class="snout">
            <div class="nose"></div>
            <div class="tongue"></div>
          </div>
        </div>
        
        <!-- Front Ear -->
        <div class="ear right"></div>
        
        <!-- Ushanka -->
        <div class="ushanka">
          <div class="hat-top"></div>
          <div class="hat-brim"></div>
          <div class="hat-flap back-flap"></div>
        </div>
      </div>
    </div>
    
  </body>
</html>
